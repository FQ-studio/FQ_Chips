name: Build and Release FQ Ecosystem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install amaranth amaranth-yosys
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Build RTL and Compile DTB
        run: |
          python fq_ecosystem/hardware/rtl/fq_icevolt_gen1.py || python hardware/rtl/fq_icevolt_gen1.py || true
          dtc -I dts -O dtb -o fq_icevolt_gen1.dtb fq_ecosystem/hardware/dts/fq_icevolt_gen1.dts || dtc -I dts -O dtb -o fq_icevolt_gen1.dtb hardware/dts/fq_icevolt_gen1.dts || true

      - name: Create Release using GH CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tentukan nama tag berdasarkan jenis event
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0-manual"
          fi
          
          echo "Mencipta release untuk tag: $TAG_NAME"
          
          # Cipta tag jika ia belum wujud (khusus untuk manual dispatch)
          git tag $TAG_NAME 2>/dev/null || true
          git push origin $TAG_NAME 2>/dev/null || true

          # Jalankan arahan gh release dengan betul
          gh release create "$TAG_NAME" fq_icevolt_gen1.dtb fq_icevolt_gen1.v \
            --title "FQ Ecosystem Release $TAG_NAME" \
            --notes "Automated build for FQ VoltX 1 & EV Ecosystem." \
            --clobber || true
