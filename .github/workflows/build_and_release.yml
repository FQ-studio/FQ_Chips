name: Build and Release FQ Ecosystem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install amaranth amaranth-yosys
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Build RTL and Compile DTB
        run: |
          # Semak fail Python dan bina Verilog
          python fq_ecosystem/hardware/rtl/fq_icevolt_gen1.py || python hardware/rtl/fq_icevolt_gen1.py || true
          
          # Compile Device Tree Blob (.dtb)
          dtc -I dts -O dtb -o fq_icevolt_gen1.dtb fq_ecosystem/hardware/dts/fq_icevolt_gen1.dts || dtc -I dts -O dtb -o fq_icevolt_gen1.dtb hardware/dts/fq_icevolt_gen1.dts || true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fq_icevolt_gen1.dtb
            fq_icevolt_gen1.v
          name: "FQ Ecosystem Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-manual' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
