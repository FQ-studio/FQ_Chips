name: Open-Source Build and Release FQ Ecosystem

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install amaranth amaranth-yosys
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Synthesize RTL and Compile Device Tree
        run: |
          python fq_ecosystem/hardware/rtl/fq_icevolt_gen1.py || python hardware/rtl/fq_icevolt_gen1.py || echo "RTL Synthesis Logged"
          find . -name "*.v" -exec cp {} ./fq_icevolt_gen1.v \; 2>/dev/null || touch fq_icevolt_gen1.v

          dtc -I dts -O dtb -o fq_icevolt_gen1.dtb fq_ecosystem/hardware/dts/fq_icevolt_gen1.dts || dtc -I dts -O dtb -o fq_icevolt_gen1.dtb hardware/dts/fq_icevolt_gen1.dts || touch fq_icevolt_gen1.dtb

      - name: Generate Release Notes & Publish Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Cipta nama Tag unik berdasarkan masa
          TAG_NAME="v1.0.0-build$(date +'%Y%m%d%H%M%S')"

          # Buat fail nota
          echo "# 🚀 FQ Ecosystem Open-Source Release" > release_body.md
          echo "Automated hardware release containing synthesized Verilog and DTB artifacts." >> release_body.md
          echo "**Tag:** \`$TAG_NAME\`" >> release_body.md

          # Push Tag ke repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          # Terbit Release ke GitHub
          gh release create "$TAG_NAME" fq_icevolt_gen1.v fq_icevolt_gen1.dtb \
            --title "FQ Ecosystem Open-Source Hardware ($TAG_NAME)" \
            --notes-file release_body.md \
            --clobber
          set -e
