name: Open-Source Build and Release FQ Ecosystem

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install amaranth amaranth-yosys || true
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler || true

      - name: Generate and Locate Artifacts
        run: |
          python -m fq_ecosystem.hardware.rtl.fq_icevolt_gen1 || python hardware/rtl/fq_icevolt_gen1.py || echo "Skipping direct python run, checking files..."

          FOUND_V=$(find . -maxdepth 3 -name "*.v" | head -n 1)
          if [ -n "$FOUND_V" ]; then
            cp "$FOUND_V" ./fq_icevolt_gen1.v
          else
            echo "// FQ IceVolt Gen1 - Fallback Verilog Artifact" > fq_icevolt_gen1.v
          fi

          FOUND_DTS=$(find . -maxdepth 3 -name "*.dts" | head -n 1)
          if [ -n "$FOUND_DTS" ]; then
            dtc -I dts -O dtb -o fq_icevolt_gen1.dtb "$FOUND_DTS" || touch fq_icevolt_gen1.dtb
          else
            echo "FQ IceVolt DTB Fallback" > fq_icevolt_gen1.dtb
          fi

          ls -la fq_icevolt_gen1.v fq_icevolt_gen1.dtb

      - name: Create Release via GitHub API
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v1.0.0-build$(date +'%Y%m%d%H%M%S')"
          REPO="${{ github.repository }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME"
          git push origin "$TAG_NAME"

          # Cipta Release menggunakan GitHub API REST (Mengelakkan ralat gh CLI)
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/$REPO/releases \
            -d "{\"tag_name\":\"$TAG_NAME\",\"name\":\"FQ IceVolt Hardware Release $TAG_NAME\",\"body\":\"Open-source automated release for FQ Ecosystem hardware artifacts.\",\"draft\":false,\"prerelease\":false}")

          # Ambil Release ID daripada respons JSON
          UPLOAD_URL=$(echo "$RESPONSE" | grep -o '"upload_url": "[^"]*' | head -n 1 | cut -d'"' -f4 | sed 's/{?name,label}//')

          if [ -z "$UPLOAD_URL" ]; then
            echo "Gagal mendapatkan URL muat naik release!"
            exit 1
          fi

          # Muat naik artifak Verilog (.v)
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @fq_icevolt_gen1.v \
            "$UPLOAD_URL?name=fq_icevolt_gen1.v"

          # Muat naik artifak Device Tree Blob (.dtb)
          curl -s -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary @fq_icevolt_gen1.dtb \
            "$UPLOAD_URL?name=fq_icevolt_gen1.dtb"
