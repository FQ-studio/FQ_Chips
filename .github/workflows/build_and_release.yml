name: Build and Release FQ Ecosystem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install amaranth amaranth-yosys
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Find and Run Amaranth & Compile DTB
        run: |
          # Cari di mana fail python berada di dalam struktur direktori repo
          PY_PATH=$(find . -name "fq_icevolt_gen1.py" | head -n 1)
          DTS_PATH=$(find . -name "fq_icevolt_gen1.dts" | head -n 1)
          
          echo "Jumpai fail Python di: $PY_PATH"
          echo "Jumpai fail DTS di: $DTS_PATH"
          
          # Jalankan sintesis Amaranth untuk jana Verilog (.v)
          python "$PY_PATH"
          
          # Compile Device Tree Blob (.dtb)
          dtc -I dts -O dtb -o fq_icevolt_gen1.dtb "$DTS_PATH"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fq_icevolt_gen1.dtb
            fq_icevolt_gen1.v
          name: "FQ Ecosystem Release ${{ github.ref_name }}"
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0-manual' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
