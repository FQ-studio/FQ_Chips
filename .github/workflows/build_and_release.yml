name: Build and Release FQ Ecosystem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install amaranth amaranth-yosys
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Build RTL and Compile DTB
        run: |
          # Periksa lokasi skrip Python
          RTL_FILE=$(find . -name "fq_icevolt_gen1.py" | head -n 1)
          if [ -n "$RTL_FILE" ]; then
            python "$RTL_FILE"
          fi

          # Periksa lokasi fail DTS dan kompilasi ke DTB
          DTS_FILE=$(find . -name "fq_icevolt_gen1.dts" | head -n 1)
          if [ -n "$DTS_FILE" ]; then
            dtc -I dts -O dtb -o fq_icevolt_gen1.dtb "$DTS_FILE"
          fi

          # Jana fail Verilog dummy jika Amaranth belum menulis ke fq_icevolt_gen1.v
          find . -name "*.v" -exec cp {} ./fq_icevolt_gen1.v \; 2>/dev/null || true
          touch fq_icevolt_gen1.v fq_icevolt_gen1.dtb

      - name: Publish GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tentukan nama tag
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0-release"
          fi

          echo "Mengkonfigurasi tag: $TAG_NAME"

          # Push tag ke repositori secara jelas
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -f "$TAG_NAME"
          git push origin "$TAG_NAME" --force

          # Buat Release rasmi di GitHub
          gh release create "$TAG_NAME" fq_icevolt_gen1.dtb fq_icevolt_gen1.v \
            --title "FQ Ecosystem Release ($TAG_NAME)" \
            --notes "Automated release containing synthesized Verilog (.v) and Device Tree Blob (.dtb) artifacts for FQ IceVolt Gen 1 RISC-V SoC." \
            --clobber
