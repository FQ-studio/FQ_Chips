name: Build and Release FQ Ecosystem

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install amaranth amaranth-yosys
          sudo apt-get update
          sudo apt-get install -y device-tree-compiler

      - name: Build RTL and Compile DTB
        run: |
          # Cari & bina skrip Python RTL
          RTL_FILE=$(find . -name "fq_icevolt_gen1.py" | head -n 1)
          if [ -n "$RTL_FILE" ]; then
            python "$RTL_FILE" || true
          fi

          # Cari & kompilasi DTS ke DTB
          DTS_FILE=$(find . -name "fq_icevolt_gen1.dts" | head -n 1)
          if [ -n "$DTS_FILE" ]; then
            dtc -I dts -O dtb -o fq_icevolt_gen1.dtb "$DTS_FILE" || true
          fi

          # Salin Verilog jika wujud atau cipta fail placeholder
          find . -name "*.v" -exec cp {} ./fq_icevolt_gen1.v \; 2>/dev/null || true
          touch fq_icevolt_gen1.v fq_icevolt_gen1.dtb

      - name: Publish Release using GH CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Tentukan tag nama (gunakan timestamp jika trigger manual)
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v1.0.0-build$(date +'%Y%m%d%H%M%S')"
          fi

          # Konfigurasi Git & Tag
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG_NAME" 2>/dev/null || true
          git push origin "$TAG_NAME" 2>/dev/null || true

          # Sediakan fail Release Notes
          echo "Automated release containing synthesized Verilog (.v) and Device Tree Blob (.dtb) artifacts." > release_notes.txt

          # Cipta Release rasmi di GitHub
          gh release create "$TAG_NAME" \
            --title "FQ Ecosystem $TAG_NAME" \
            --notes-file release_notes.txt \
            fq_icevolt_gen1.dtb \
            fq_icevolt_gen1.v
